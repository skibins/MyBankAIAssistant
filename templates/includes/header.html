<header>
        <div class="accessibility-tools">
            <button id="highContrastBtn" aria-label="Włącz wysoki kontrast">👁️</button>
            <button id="fontIncreaseBtn" aria-label="Powiększ czcionkę">A+</button>
            <button id="fontDecreaseBtn" aria-label="Pomniejsz czcionkę">A-</button>
            <button id="fontResetBtn" aria-label="Resetuj czcionkę">A⟲</button>
            <button id="dyslexicFontBtn" aria-label="Czcionka dla dyslektyków">Dyslexic</button>
            <button id="underlineLinksBtn" aria-label="Podkreśl linki">🔗</button>
        </div>
        <div class="logo">
           <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="MyBank Logo">
            <h1>MyBank</h1>
        </div>
        <nav>
            <ul>
                <li><a id="homeButton">Home</a></li>
                <li><a id="servicesButton">Services</a></li>
                <li><a id="aboutButton">About Us</a></li>
                 {% if session['user_email'] %}
                    <li><a href="/logout" id="logoutButton" style="color: #f9f9f9;">Log out</a></li>
                {% else %}
                    <li><a id="loginButton">Login</a></li>
                {% endif %}
            </ul>
        </nav>
        <script src="{{ url_for('static', filename='includes/header/header.js') }}"></script>
</header>
